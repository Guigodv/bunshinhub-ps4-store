name: Build BunshinHub PS4 PKG

on:
  push:
    branches: [bunshinhub-v2]
    paths:
      - "Store/**"
      - "Store-Loader/**"
      - "App Media-Assets/**"
      - "scripts/**"
      - ".github/workflows/native-ps4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps4-pkg:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout BunshinHub fork
        uses: actions/checkout@v4

      - name: Install PS4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl libicu-dev libcurl4-openssl-dev
          which clang
          which ld.lld

      - name: Install OpenOrbis v0.5.4 SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -fL --retry 3 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            -o "$RUNNER_TEMP/openorbis.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/openorbis"
          # A release archive contains an extra OpenOrbis/ directory.
          # Resolve the actual SDK root rather than assuming the extraction root.
          SDK_LINKER="$(find "$RUNNER_TEMP/openorbis" -type f -name link.x -print -quit)"
          if [ -z "$SDK_LINKER" ]; then
            echo "::error::OpenOrbis link.x was not found in the extracted SDK"
            find "$RUNNER_TEMP/openorbis" -maxdepth 3 -type d -print
            exit 1
          fi
          SDK_ROOT="$(dirname "$SDK_LINKER")"
          echo "OpenOrbis SDK root: $SDK_ROOT"
          test -f "$SDK_ROOT/bin/linux/PkgTool.Core"
          ls -lh "$SDK_ROOT/bin/linux/PkgTool.Core"
          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"
          # The OpenOrbis release does not bundle cURL development headers.
          # Stage headers separately; actual PS4 linking still requires a compatible libcurl.
          if [ ! -f "$SDK_ROOT/include/curl/curl.h" ]; then
            test -f /usr/include/x86_64-linux-gnu/curl/curl.h
            cp -R /usr/include/x86_64-linux-gnu/curl "$SDK_ROOT/include/"
          fi
          test -f "$SDK_ROOT/include/curl/curl.h"
          echo "cURL headers staged for cross-compilation"
          find "$SDK_ROOT/lib" -maxdepth 1 -iname '*curl*' -print || true

      - name: Validate BunshinHub package sources
        run: python3 scripts/check_package_config.py

      - name: Compile PS4 loader
        run: make -C Store-Loader -j2

      - name: Compile and package BunshinHub
        run: make -C Store -j2

      - name: Inspect generated package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_package_config.py --after-build
          find Store -maxdepth 1 -type f -name '*.pkg' -ls
          find Store -maxdepth 1 -type f -name '*.pkg' | grep -q '.pkg'

      - name: Upload native PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: BunshinHub-PS4-PKG
          path: Store/*.pkg
          if-no-files-found: error
